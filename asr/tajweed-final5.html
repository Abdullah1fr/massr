<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fdf5e0">
<title>التسميع (أوفلاين)</title>
<style>
:root{--bg:#fdfbf6;--card:#fdf5e0;--bd:#b9c0c9;--gold:#c9a24a;--gold2:#8a5a00;--green:#1d4a3a;--ink:#8a5a00;--blue:#2d6cdf;--ok:#1f8a5b;--bad:#d4443f;--miss:#e08a1e;--mut:#6b7280;
--quran:'Amiri Quran','Amiri','Scheherazade New','Traditional Arabic','Noto Naskh Arabic',serif;--ui:system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans Arabic',sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:#222;font-family:var(--ui)}
body{padding:env(safe-area-inset-top) 10px calc(150px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#head{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:8px;margin:8px 0 10px;padding:10px 14px;background:var(--card);border:1px solid var(--bd);border-radius:22px}
#head .t{flex:1;text-align:center;min-width:0}
#surName{font-size:20px;font-weight:700}#sub{font-size:13px;color:var(--mut)}
.ic{width:40px;height:40px;border-radius:12px;font-size:21px;display:grid;place-items:center}
.ic:active{background:#f1e6c4}
.ayc{display:flex;align-items:flex-start;gap:8px;margin:0 0 14px;scroll-margin:120px}
.card{flex:1;min-width:0;background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:18px 18px 22px;font-family:var(--quran);font-size:29px;line-height:2.15;color:var(--ink);text-align:justify;transition:border-color .25s,box-shadow .25s}
.ayc.curA .card{border-color:var(--blue);box-shadow:0 0 0 3px rgba(45,108,223,.15)}
.medal{flex:none;width:62px;height:62px;border-radius:50%;margin-top:4px;background:radial-gradient(circle,var(--card) 56%,var(--gold) 58% 65%,var(--green) 67%);display:grid;place-items:center;font:700 19px var(--ui);color:var(--green)}
.w{display:inline;padding:0 3px;border-radius:8px;transition:background .15s,color .15s}
.w.pass{color:#6a7d4f}.w.ok{color:var(--ok)}
.w.bad{color:var(--bad);text-decoration:underline wavy var(--bad);text-underline-offset:7px}
.w.miss{color:var(--miss);text-decoration:underline dotted var(--miss);text-underline-offset:7px}
.w.cur{background:var(--blue);color:#fff;text-decoration:none}
/* اختبار: كل الكروت قد بعضها وفاضية، والكلمة بتتكتب لما تتقال */
.test .card{height:158px;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.9}
.test .txt{max-height:100%;overflow:hidden}
/* تدريب: شرطة لكل كلمة، والكلمة بتظهر لما تتقال أو بزرار العين */
.train .w:not(.rv){display:inline-block;font-size:0;width:calc(var(--n,3)*9px + 14px);height:6px;margin:0 7px;padding:0;background:#d8cfb4;border-radius:4px;vertical-align:middle}
.train .w.cur:not(.rv){background:var(--blue)}
.train.showall .w:not(.rv){display:inline;font-size:inherit;width:auto;height:auto;margin:0;padding:0 3px;background:none;border-radius:8px;vertical-align:baseline}
.test .w{display:none}.test .w.rv{display:inline}
.test .w.cur.rv{background:none;color:var(--blue)}
.test .w.bad.rv,.test .w.miss.rv{display:inline-block;font-size:0;color:transparent;width:2.3em;height:.5em;margin:0 6px;background:var(--bad);border-radius:6px;vertical-align:middle;text-decoration:none;cursor:pointer}
.test .w.hint.rv{display:inline;font-size:inherit;width:auto;height:auto;margin:0;background:none;color:var(--gold2);text-decoration:underline dotted var(--gold2);cursor:default}
/* الشريط السفلي */
#pill{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:4;display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--card);border:1.5px solid var(--gold);border-radius:30px;box-shadow:0 8px 26px rgba(80,60,10,.18)}
.mw{display:flex;flex-direction:column;align-items:center;gap:3px;flex:none}
#mic{width:60px;height:60px;border-radius:50%;background:var(--ec,#1f8a5b);color:#fff;display:grid;place-items:center;font-size:27px;touch-action:none;user-select:none;-webkit-user-select:none;transition:background .2s,transform .15s}
#mic:active{transform:scale(.94)}
#mic.rec{background:var(--bad);animation:rec 1.2s ease-in-out infinite}
@keyframes rec{50%{box-shadow:0 0 0 10px rgba(212,68,63,.22)}}
#engLab{font-size:11px;font-weight:700;color:var(--ec,#1f8a5b)}#mic span{filter:grayscale(1) brightness(3)}
#pmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
#pstate{font-size:14px;color:#333;line-height:1.4;min-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pnum{display:none;margin-inline-start:8px;font-size:11px;color:var(--mut)}.dbg #pnum{display:inline}
.ctl{display:flex;align-items:center;gap:8px}
.seg{display:flex;background:#f1e6c4;border-radius:14px;padding:3px;flex:none}
.seg button{padding:7px 12px;border-radius:11px;font-size:13px;color:var(--gold2);transition:background .2s,color .2s}
.seg button.on{background:var(--gold2);color:#fff;font-weight:700}
.pb{width:38px;height:38px;border-radius:50%;background:#f1e6c4;font-size:18px;flex:none;display:grid;place-items:center;color:var(--gold2)}
.pb[hidden]{display:none}.pb svg{width:21px;height:21px}
#fin{background:var(--green);color:#fff}
#peek .sl{opacity:1;transition:opacity .15s}#peek.on .sl{opacity:0}
/* شاشات */
#load{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;z-index:9}
#load h1{margin:0;font-size:24px;color:var(--green)}#load p{margin:0;color:var(--mut);max-width:32ch;line-height:1.7}
#go{padding:14px 28px;border-radius:16px;background:var(--gold);font-size:18px;font-weight:700}#go:disabled{opacity:.6}
#bar{width:min(260px,70vw);height:6px;background:#eee3c0;border-radius:3px;overflow:hidden}#bar i{display:block;height:100%;width:0;background:var(--gold2);transition:width .2s}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:86vh;overflow:auto;background:var(--card);border-top:1px solid var(--bd);border-radius:22px 22px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .34s cubic-bezier(.2,.9,.3,1);z-index:7}
.sheet.open{transform:none}.sheet h2{margin:0 0 12px;font-size:18px;color:var(--green)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #eadfba}.row label{font-size:15px}
select,input[type=number]{font:inherit;background:#fff;border:1px solid var(--bd);border-radius:10px;padding:8px 10px;max-width:58%}input[type=number]{width:76px;text-align:center}
.sw{width:50px;height:28px;border-radius:14px;background:#cfc8b0;position:relative;transition:.2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}.sw.on{background:var(--ok)}.sw.on::after{right:25px}
.act{padding:11px 14px;border-radius:12px;background:var(--gold);font-weight:700;width:100%;margin-top:10px}.act.alt{background:#efe3bb}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:.3s;z-index:6}#scrim.show{opacity:1;pointer-events:auto}
.big{font-size:44px;font-weight:700;line-height:1.1;color:var(--green)}
.rep{display:flex;gap:10px;margin:10px 0 14px}.rep div{flex:1;background:#fff;border-radius:14px;padding:12px;text-align:center;font-size:13px;color:var(--mut)}.rep b{display:block;font-size:26px;color:#222}
.li{padding:8px 0;border-bottom:1px solid #eadfba;font:21px var(--quran)}.li small{font:13px var(--ui);color:var(--mut);margin-inline-start:8px}
#toast{position:fixed;left:50%;bottom:150px;transform:translate(-50%,20px);background:#2b2b2b;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.3s;z-index:10;max-width:86vw;text-align:center}#toast.show{opacity:1;transform:translate(-50%,0)}
#cls{display:none}.emb #cls{display:grid}.emb #go{display:none}
small.src{display:block;color:var(--mut);font-size:11px;line-height:1.6;padding:6px 8px;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  <div class="row"><label>إظهار تفاصيل التحليل</label><button class="sw" id="sDbg" aria-label="تفاصيل"></button></div>

  <button class="act" id="setClose">تمام</button>

  $('mTrain').classList.toggle('on', cfg.mode !== 'test'); $('mTest').classList.toggle('on', cfg.mode === 'test');
}
function setMode(m) { if (cfg.mode === m) return; cfg.mode = m; save(); applyUI(); if (REFS) { if (cfg.sur !== curSur) render(); else build(); } }
$('mTrain').onclick = () => setMode('train'); $('mTest').onclick = () => setMode('test');
$('sSur').innerHTML = NAMES.map((n, i) => `<option value="${i + 1}">${ar(i + 1)}. ${n}</option>`).join('');
$('sSur').onchange = () => { cfg.sur = +$('sSur').value; cfg.fa = 1; cfg.ta = 0; save(); applyUI(); if (REFS) render(); };
$('sFa').onchange = $('sTa').onchange = () => { cfg.fa = +$('sFa').value || 1; cfg.ta = +$('sTa').value || 0; save(); if (REFS) build(); };
$('sStrict').onchange = () => { cfg.strict = $('sStrict').value; save(); if (trk) { trk.setT(TH[cfg.strict]); refreshRange(lo, hi); fitDirty(); } };
$('sWin').onchange = () => { cfg.win = +$('sWin').value; save(); };
$('sHold').onclick = () => { cfg.hold = !cfg.hold; save(); applyUI(); };
$('sAuto').onclick = () => { cfg.auto = !cfg.auto; save(); applyUI(); };
$('sDbg').onclick = () => { cfg.dbg = !cfg.dbg; save(); applyUI(); };
$('cls').onclick = async () => { if (rec) await stop(false); try { parent.postMessage({ tasmee: 'close' }, '*'); } catch (e) {} };
$('again').onclick = () => { if (REFS) render(); };
$('peek').onclick = () => { if (cfg.mode === 'test') return; cfg.show = !cfg.show; save(); $('list').classList.toggle('showall', cfg.show); $('peek').classList.toggle('on', cfg.show); };
function hintWord(i) {
  if (!trk || cfg.mode !== 'test' || i < lo || i > hi || hinted.has(i)) return;
  hinted.add(i); refresh(i); fitDirty(); toast('تلميح اتحسب 💡');
}
function nextHint() {
  for (let i = Math.max(lo, disp - 60); i < disp; i++) { const st = trk.status(i); if ((st === 'wrong' || st === 'missing') && !hinted.has(i)) return i; }
  let i = trk.ptr < 0 ? lo : trk.ptr + 1; while (i <= hi && hinted.has(i)) i++; return i <= hi ? i : -1;
}
$('hint').onclick = () => { const i = nextHint(); if (i >= 0) hintWord(i); };
$('list').addEventListener('click', e => { const el = e.target.closest && e.target.closest('.w.bad.rv,.w.miss.rv'); if (el && cfg.mode === 'test') hintWord(+el.id.slice(1)); });
$('rnd').onclick = () => {
  if (!surah) return; const nAy = surah.words[surah.words.length - 1].ay, a0 = 1 + Math.floor(Math.random() * nAy);
  cfg.fa = a0; cfg.ta = Math.min(nAy, a0 + 9); cfg.mode = 'test'; save(); applyUI(); if (rec) trk.ptr = -1; build(); closeSheets(); toast('اختبار من آية ' + ar(a0));
};
$('fin').onclick = () => { if (rec) stop(true); else showReport(); };
$('copy').onclick = () => {
  const v = []; if (trk) trk.V.forEach((x, i) => v.push([i, +x.best.toFixed(2), +x.first.toFixed(2), x.kind, x.n]));
  navigator.clipboard.writeText(JSON.stringify({ ...log, cfg, verdicts: v.slice(-250), passes: log.passes.slice(-160) })).then(() => toast('اتنسخ ✓'), () => toast('مقدرتش أنسخ'));
};
// ---------- منتقي أوفلاين/أونلاين: ضغطة مطوّلة على الميكروفون ----------
const CH = makeChooser(() => cfg.engine, eng => { cfg.engine = eng; save(); applyUI(); toast(eng === 'offline' ? 'أوفلاين: من غير نت' : 'أونلاين'); if (EMB && eng === 'online') { try { parent.postMessage({ tasmee: 'online' }, '*'); } catch (e) {} } });
let pressT = null, long = false, pdown = null;
window.addEventListener('pointermove', e => { if (CH.on) CH.move(e.clientX, e.clientY); else if (pressT && pdown && Math.hypot(e.clientX - pdown.x, e.clientY - pdown.y) > 14) { clearTimeout(pressT); pressT = null; } });
{
  const mic = $('mic');
  mic.addEventListener('pointerdown', e => { if (rec || CH.on) return; try { mic.setPointerCapture(e.pointerId); } catch (x) {} long = false; pdown = { x: e.clientX, y: e.clientY }; clearTimeout(pressT); pressT = setTimeout(() => { pressT = null; long = true; CH.open(mic); }, 380); });
  mic.addEventListener('pointerup', e => { clearTimeout(pressT); pressT = null; if (long) { long = false; CH.release(e.clientX, e.clientY, false); return; } if (rec) stop(true); else start().catch(fail); });
  mic.addEventListener('pointercancel', e => { clearTimeout(pressT); pressT = null; if (long) { long = false; CH.release(e.clientX, e.clientY, true); } });
  mic.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('touchmove', e => { if (CH.on) e.preventDefault(); }, { passive: false });
}
// ---------- التحميل ----------
$('go').onclick = async () => {
  if (!Core.VERSION || Core.VERSION < 7) { $('lmsg').textContent = 'ملف tajweed-core5.js على الموقع قديم. ارفع النسخة الأحدث وحدّث الصفحة.'; return; }
  $('go').disabled = true; $('lmsg').textContent = 'بحمّل…';
  worker = new Worker('tajweed-worker.js', { type: 'module' });
  worker.onmessage = e => {
    const m = e.data; if (m.type === 'progress') { $('bar').firstElementChild.style.width = m.pct + '%'; return void ($('lmsg').textContent = 'بحمّل النموذج (أول مرة بس)… ' + m.pct + '%'); }
    const w = wait.get(m.id); wait.delete(m.id); if (w) m.type === 'error' ? w.rej(new Error(m.message)) : w.res(m);
  };
  worker.onerror = e => { $('lmsg').textContent = 'خطأ: ' + (e.message || 'الـ worker ماشتغلش'); $('go').disabled = false; };
  try {
    const r = await ask({ type: 'load' }); log.loadMs = r.ms; log.cached = !!r.cached;
    $('lmsg').textContent = 'بحمّل المصحف…'; await loadRefs(); applyUI(); render(); startQ(); ready = true;
    $('load').style.display = 'none'; toast((r.cached ? 'النموذج من المخزّن' : 'النموذج اتحمّل واتخزّن') + ' · ' + (r.ms / 1000).toFixed(1) + ' ث');
  } catch (e) { $('lmsg').textContent = 'خطأ: ' + e.message; log.error = e.message; $('go').disabled = false; }
};
applyUI();
if (EMB) setTimeout(() => $('go').click(), 30);
</script>
