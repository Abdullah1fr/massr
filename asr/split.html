<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تقسيم ملف النموذج</title>
<style>body{font-family:system-ui,sans-serif;max-width:560px;margin:24px auto;padding:0 16px;line-height:1.7}button,input{font:inherit}a.p{display:block;margin:6px 0;padding:10px;border:1px solid #c6a04a;border-radius:10px;text-decoration:none}</style>
<h2>تقسيم ملف النموذج لأجزاء</h2>
<p>موقع GitHub بيقبل رفع ملف لحد ٢٥ ميجا بس. اختار الملف الكبير (<b>decoder_model_merged_quantized.onnx</b>) وأنا أقسمه أجزاء ٢٠ ميجا. نزّل كل الأجزاء + <b>parts.json</b> وارفعهم في <b>asr/models/quran-tiny/onnx/</b>.</p>
<input type="file" id="f"> <div id="o"></div>
<script>
const CH=20*1024*1024;
f.onchange=async()=>{const file=f.files[0];if(!file)return;o.innerHTML='';
 const n=Math.ceil(file.size/CH),names=[];
 for(let i=0;i<n;i++){const name=file.name+'.part'+(i+1);names.push(name);
  const url=URL.createObjectURL(file.slice(i*CH,(i+1)*CH));
  o.insertAdjacentHTML('beforeend','<a class="p" download="'+name+'" href="'+url+'">⬇️ '+name+'</a>');}
 const man={};man[file.name]=names;
 o.insertAdjacentHTML('afterbegin','<a class="p" download="parts.json" href="'+URL.createObjectURL(new Blob([JSON.stringify(man,null,1)],{type:'application/json'}))+'">⬇️ parts.json (لازم)</a>');
};
</script></html>
